<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img">
<title>Cloudflare to Sentinel data flow</title>
<desc>A horizontal whiteboard cartoon on a black background with a rounded border, showing logs flowing from Cloudflare GraphQL API through CCF RestApiPoller and a DCR KQL transform into the cloudflarefirewall_CL Log Analytics table.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/>
<feDisplacementMap in="SourceGraphic" scale="1.6"/>
</filter>
<filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/>
<feDisplacementMap in="SourceGraphic" scale="1.4"/>
</filter>
</defs>

<rect x="6" y="6" width="708" height="488" rx="20" fill="#0d0d0f"/>
<rect x="6" y="6" width="708" height="488" rx="20" fill="none" stroke="#3a3a3f" stroke-width="2"/>
<rect x="14" y="14" width="692" height="472" rx="16" fill="none" stroke="#1f1f23" stroke-width="1"/>

<text x="360" y="58" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="17" fill="#f0f0ec">Cloudflare logs &#8594; Microsoft Sentinel</text>
<g filter="url(#rough2)" opacity="0.5">
<path d="M225 70 Q360 76 495 70" stroke="#888" stroke-width="1" fill="none"/>
</g>

<g filter="url(#rough)">
<rect x="50" y="135" width="160" height="100" rx="10" fill="#412402" stroke="#EF9F27" stroke-width="1.6"/>
</g>
<g filter="url(#rough2)" opacity="0.85" stroke="#FAC775" stroke-width="1.4" fill="none" stroke-linecap="round">
<path d="M85 113 q-4 -8 6 -10 q2 -8 12 -6 q4 -8 14 -4 q6 -6 14 0 q10 -2 10 8 q8 0 6 8 z"/>
</g>
<text x="130" y="170" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#FAC775">Cloudflare</text>
<text x="130" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#FAC775">GraphQL API</text>
<text x="130" y="215" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#FAEEDA">(your zone)</text>

<g filter="url(#rough2)">
<path d="M215 185 Q235 185 258 185" stroke="#bbb" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>
</g>
<text x="237" y="172" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#aaa">pulls logs</text>

<g filter="url(#rough)">
<rect x="265" y="135" width="180" height="100" rx="10" fill="#085041" stroke="#1D9E75" stroke-width="1.6"/>
</g>
<g filter="url(#rough2)" opacity="0.9" stroke="#9FE1CB" stroke-width="1.3" fill="none" stroke-linecap="round">
<circle cx="355" cy="113" r="11"/>
<path d="M355 113 L355 105 M355 113 L361 115"/>
</g>
<text x="355" y="170" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#9FE1CB">CCF</text>
<text x="355" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#9FE1CB">RestApiPoller</text>
<text x="355" y="215" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#E1F5EE">(every 1 min)</text>

<g filter="url(#rough2)">
<path d="M450 185 Q475 185 498 185" stroke="#bbb" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>
</g>
<text x="475" y="172" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#aaa">raw JSON</text>

<g filter="url(#rough)">
<rect x="505" y="135" width="160" height="100" rx="10" fill="#26215C" stroke="#7F77DD" stroke-width="1.6"/>
</g>
<g filter="url(#rough2)" opacity="0.85" stroke="#CECBF6" stroke-width="1.3" fill="none" stroke-linecap="round">
<circle cx="585" cy="113" r="9"/>
<circle cx="585" cy="113" r="3"/>
<path d="M585 102 L585 98 M585 124 L585 128 M574 113 L570 113 M596 113 L600 113"/>
</g>
<text x="585" y="170" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#CECBF6">DCR</text>
<text x="585" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#CECBF6">(KQL transform)</text>
<text x="585" y="215" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#EEEDFE">field mapping</text>

<g filter="url(#rough2)">
<path d="M585 240 Q585 295 470 325 Q400 342 340 342" stroke="#bbb" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>
</g>
<text x="495" y="312" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#aaa">transformed rows</text>

<g>
<ellipse cx="200" cy="345" rx="115" ry="14" fill="#042C53" stroke="#378ADD" stroke-width="1.4"/>
<path d="M85 345 L85 410 Q85 424 200 424 Q315 424 315 410 L315 345" fill="#042C53" stroke="#378ADD" stroke-width="1.4"/>
<path d="M85 410 Q85 424 200 424 Q315 424 315 410" fill="none" stroke="#378ADD" stroke-width="1" opacity="0.5"/>
<path d="M85 365 Q85 379 200 379 Q315 379 315 365" fill="none" stroke="#378ADD" stroke-width="0.9" opacity="0.4"/>
<path d="M85 388 Q85 402 200 402 Q315 402 315 388" fill="none" stroke="#378ADD" stroke-width="0.9" opacity="0.3"/>
</g>
<text x="200" y="362" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#B5D4F4">cloudflarefirewall_CL</text>
<text x="200" y="395" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#B5D4F4">Log Analytics workspace</text>
<text x="200" y="415" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#85B7EB" opacity="0.8">ready to query in Sentinel &#10003;</text>

<g opacity="0.6" stroke="#888" stroke-width="1.1" stroke-linecap="round" fill="none">
<path d="M55 380 L51 376 M55 380 L51 384 M55 380 L59 376 M55 380 L59 384"/>
<path d="M340 360 L336 356 M340 360 L336 364 M340 360 L344 356 M340 360 L344 364"/>
<path d="M40 425 L36 421 M40 425 L36 429 M40 425 L44 421 M40 425 L44 429"/>
</g>

<g filter="url(#rough2)" opacity="0.7">
<path d="M340 360 Q400 350 440 348" stroke="#aaa" stroke-width="1" fill="none" stroke-linecap="round"/>
<path d="M438 344 L443 348 L438 352" stroke="#aaa" stroke-width="1" fill="none" stroke-linecap="round"/>
</g>
<text x="450" y="352" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#aaa">your data!</text>

</svg>
